<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>회원가입 인증 — 데모</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body{ font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; background:#F3F4F6; margin:0; }
  .phone{ max-width:600px; margin:0 auto; background:#fff; min-height:100vh; }
  .hd{ height:56px; display:flex; align-items:center; gap:10px; padding:0 14px; border-bottom:1px solid #F3F4F6; }
  .hd .back{ font-size:22px; color:#030712; }
  .hd .title{ font-size:18px; font-weight:700; color:#030712; }
  .demo-note{ margin:12px 16px 0; font-size:12px; color:#9CA3AF; line-height:1.5; background:#F9FAFB; border:1px dashed #E5E7EB; border-radius:10px; padding:8px 12px; }
  .label{ font-size:14px; font-weight:600; color:#1E2939; margin:0 0 8px; }
  .req{ color:#FF6467; margin-left:2px; }
  .inp{ width:100%; height:48px; border:1.5px solid #E5E7EB; border-radius:12px; padding:0 14px; font-size:15px; color:#1E2939; box-sizing:border-box; outline:none; }
  .inp:focus{ border-color:#f472b6; box-shadow:0 0 0 3px rgba(244,114,182,.15); }
  .inp:disabled{ background:#F9FAFB; color:#6A7282; }
  .notice{ margin-top:8px; display:flex; align-items:flex-start; gap:8px; border-radius:12px; background:#FEF9E7; border:1px solid #FDE68A; padding:10px 12px; }
  .notice p{ margin:0; font-size:12.5px; line-height:1.5; color:#854D0E; }
  .notice b{ color:#030712; font-weight:700; }
  .kakao-btn{ margin-top:10px; width:100%; height:48px; border:none; border-radius:12px; background:#FEE500; color:#191600; font-size:15px; font-weight:700; display:flex; align-items:center; justify-content:center; gap:6px; cursor:pointer; }
  .kakao-btn:active{ opacity:.8; }
  .code-row{ display:flex; gap:8px; margin-top:10px; }
  .code-row .inp{ flex:1; }
  .verify-btn{ height:48px; padding:0 18px; border:1.5px solid #f472b6; border-radius:12px; background:#fff; color:#ec4899; font-size:15px; font-weight:700; white-space:nowrap; cursor:pointer; }
  .timer{ font-size:13px; color:#FF6467; font-weight:600; float:right; }
  .ok-msg{ font-size:13px; color:#10b981; margin-top:8px; }
  .toast{ position:fixed; left:50%; bottom:36px; transform:translateX(-50%); background:rgba(17,24,39,.92); color:#fff; font-size:13.5px; line-height:1.5; padding:12px 18px; border-radius:12px; text-align:center; opacity:0; transition:opacity .25s; pointer-events:none; max-width:80%; }
  .toast.show{ opacity:1; }
  .seg{ display:flex; gap:6px; margin:14px 16px 0; }
  .seg button{ flex:1; height:34px; border-radius:8px; border:1px solid #E5E7EB; background:#fff; font-size:12.5px; color:#6A7282; font-weight:600; cursor:pointer; }
  .seg button.on{ background:#fdf2f8; border-color:#f472b6; color:#ec4899; }
</style>
</head>
<body>
<div class="phone">
  <div class="hd"><span class="back">‹</span><span class="title">회원가입</span></div>

  <p class="demo-note">📱 실제 가입화면의 <b>휴대폰 인증 영역 데모</b>입니다. 아래 버튼/탭을 눌러 단계별 화면을 확인하세요. (실제 발송은 되지 않습니다)</p>

  <!-- 단계 보기 탭 -->
  <div class="seg">
    <button id="s0" class="on" onclick="setStage(0)">① 전송 전</button>
    <button id="s1" onclick="setStage(1)">② 전송 후</button>
    <button id="s2" onclick="setStage(2)">③ 인증 완료</button>
  </div>

  <div style="padding:18px 16px 40px">
    <p class="label">휴대폰번호<span class="req">*</span><span id="timer" class="timer" style="display:none"></span></p>

    <input id="phone" class="inp" type="tel" inputmode="numeric" placeholder="'-' 없이 숫자만 입력해주세요." value="01012345678" />

    <!-- 카톡 안내 박스 (인증 완료 전 상시 노출) -->
    <div id="notice" class="notice">
      <span style="font-size:15px;line-height:1">💬</span>
      <p>인증번호는 <b>카카오톡</b>으로 발송됩니다. 문자(SMS)가 아니니 <b>카카오톡</b>을 확인해 주세요.</p>
    </div>

    <!-- 카톡 전송 버튼 -->
    <button id="kakaoBtn" class="kakao-btn" onclick="onSend()">
      <span style="font-size:16px;line-height:1">💬</span><span id="kakaoTxt">카카오톡으로 인증번호 받기</span>
    </button>

    <!-- 인증번호 입력 (전송 후) -->
    <div id="codeRow" class="code-row" style="display:none">
      <input id="code" class="inp" inputmode="numeric" placeholder="인증번호를 입력하세요." />
      <button class="verify-btn" onclick="onVerify()">인증하기</button>
    </div>

    <!-- 인증 완료 -->
    <div id="okMsg" class="ok-msg" style="display:none">✓ 휴대폰 인증이 완료되었습니다.</div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
let timerId = null;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }
function fmt(s){ const m=String(Math.floor(s/60)).padStart(2,'0'); const x=String(s%60).padStart(2,'0'); return m+':'+x; }
function startTimer(){ let s=180; const el=document.getElementById('timer'); el.style.display='inline'; el.textContent=fmt(s);
  clearInterval(timerId); timerId=setInterval(()=>{ s--; el.textContent=fmt(s); if(s<=0){clearInterval(timerId);} },1000); }

function setStage(n){
  ['s0','s1','s2'].forEach((id,i)=>document.getElementById(id).classList.toggle('on', i===n));
  const sent = n>=1, verified = n===2;
  document.getElementById('notice').style.display   = verified ? 'none' : 'flex';
  document.getElementById('kakaoBtn').style.display = verified ? 'none' : 'flex';
  document.getElementById('kakaoTxt').textContent   = sent ? '카카오톡으로 다시 받기' : '카카오톡으로 인증번호 받기';
  document.getElementById('codeRow').style.display  = (sent && !verified) ? 'flex' : 'none';
  document.getElementById('okMsg').style.display    = verified ? 'block' : 'none';
  document.getElementById('phone').disabled         = verified;
  if(sent && !verified){ startTimer(); } else { clearInterval(timerId); document.getElementById('timer').style.display='none'; }
}
function onSend(){ const stage1 = document.getElementById('codeRow').style.display==='flex';
  setStage(1); toast('인증번호가 발송되었습니다.\n카카오톡을 확인해주세요.'); }
function onVerify(){ setStage(2); toast('휴대폰 인증이 완료되었습니다.'); }

// 줄바꿈 토스트
document.getElementById('toast').style.whiteSpace='pre-line';
setStage(0);
</script>
</body>
</html>
